site_name: kaggle-llm
site_description: Run an Ollama LLM on a free Kaggle GPU and use it from your code and agents.
site_url: https://gatmatz.github.io/kaggle-llm/
repo_url: https://github.com/Gatmatz/kaggle-llm
repo_name: Gatmatz/kaggle-llm
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.footer
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Connecting clients and agents: agents.md
      - Thinking models: thinking.md
      - Running experiments: experiments.md
  - Reference:
      - Configuration: configuration.md
      - Command line: cli.md
      - Python API: api.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
